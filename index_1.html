<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قمرا كافيه | المنيو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ecdf;--card:#f5f7ee;--ink:#1a2217;--mute:#5a6650;--acc:#8a4a12;--line:#c5cdb5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1310;--card:#141c17;--ink:#f1e7d3;--mute:#a9a58f;--acc:#f0a13c;--line:#2b372e}}
:root[data-theme="dark"]{--bg:#0d1310;--card:#141c17;--ink:#f1e7d3;--mute:#a9a58f;--acc:#f0a13c;--line:#2b372e}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.6}
img{display:block}
.hero{position:relative;height:100svh;min-height:540px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;text-align:center;color:#fff;background:#0d1310}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14) translateY(-1.5%)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,8,.35) 0%,transparent 28%,rgba(8,10,8,.15) 55%,var(--bg) 100%)}
.hc{position:relative;z-index:2;padding:0 20px 72px}
.logo{width:68px;height:68px;border-radius:50%;margin:0 auto 10px;border:2px solid rgba(255,255,255,.75);animation:up 1s .2s both}
h1{font-family:"Aref Ruqaa",serif;font-weight:700;font-size:clamp(76px,22vw,150px);line-height:1.05;margin:0;text-shadow:0 6px 30px rgba(0,0,0,.55);animation:rev 1.8s .4s both}
@keyframes rev{from{opacity:0;filter:blur(16px);letter-spacing:.25em}to{opacity:1;filter:blur(0);letter-spacing:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.en{font-size:14px;letter-spacing:.4em;margin:0;animation:up 1s 1.4s both}
.tag{font-size:19px;margin:10px 0 22px;animation:up 1s 1.7s both;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.go{display:inline-block;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.7);padding:9px 26px;border-radius:999px;font-weight:500;backdrop-filter:blur(4px);animation:up 1s 2s both}
.em{position:absolute;bottom:-10px;z-index:1;border-radius:50%;background:#ffc062;box-shadow:0 0 10px 3px rgba(255,170,60,.7);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}100%{opacity:0;transform:translate(24px,-75vh)}}
@media(prefers-reduced-motion:reduce){.hero>img,.em,h1,.logo,.en,.tag,.go{animation:none}.em{display:none}html{scroll-behavior:auto}}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
#tabs{display:flex;gap:18px;overflow-x:auto;padding:0 16px;scrollbar-width:none;max-width:860px;margin:auto}
#tabs::-webkit-scrollbar{display:none}
#tabs a{flex:none;color:var(--mute);text-decoration:none;font-size:15px;font-weight:500;padding:14px 2px 12px;border-bottom:2px solid transparent;white-space:nowrap;transition:color .25s,border-color .25s}
#tabs a.on{color:var(--acc);border-color:var(--acc);font-weight:600}
#tabs a:focus-visible,.ig:focus-visible,.go:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
main{max-width:860px;margin:0 auto;padding:18px 16px 24px}
.cur{margin:0;color:var(--mute);font-size:14px;text-align:center}
section{margin-top:28px}
.band{position:relative;height:42vh;min-height:230px;overflow:hidden;margin:0 -16px;display:flex;align-items:flex-end}
.band img{position:absolute;left:0;top:-14%;width:100%;height:128%;object-fit:cover;will-change:transform}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 2%,transparent 62%),linear-gradient(180deg,rgba(0,0,0,.35),transparent 40%)}
h2{font-family:"Aref Ruqaa",serif;font-size:40px;line-height:1.2;margin:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2 small{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:13px;letter-spacing:.14em;font-weight:400;color:var(--mute)}
.band h2{position:relative;z-index:2;color:#fff;padding:0 16px 8px;text-shadow:0 2px 16px rgba(0,0,0,.7)}
.band h2 small{color:rgba(255,255,255,.85)}
h2.pl{color:var(--acc);font-size:32px;margin:6px 0 4px}
.note{margin:8px 0 0;color:var(--mute);font-size:14px}
ul{list-style:none;margin:6px 0 0;padding:0}
@media(min-width:700px){ul.two{columns:2;column-gap:44px}ul.two li{break-inside:avoid}}
li{display:flex;align-items:flex-end;gap:10px;padding:11px 0}
.n{display:flex;flex-direction:column;line-height:1.3}
.n b{font-size:17px;font-weight:600}
.n small{font-size:12.5px;color:var(--mute);direction:ltr;text-align:right}
li i{flex:1;border-bottom:1.5px dotted var(--line);margin-bottom:7px;min-width:14px}
.p{font-weight:600;font-size:18px;color:var(--acc);font-variant-numeric:tabular-nums;min-width:30px;text-align:left}
footer{position:relative;text-align:center;color:#fff;padding:90px 20px 56px;margin-top:30px;overflow:hidden}
footer>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%}
footer::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(8,10,8,.55),rgba(8,10,8,.55)),linear-gradient(180deg,var(--bg),transparent 40%)}
footer>div,footer>a{position:relative;z-index:2}
footer .t{font-family:"Aref Ruqaa",serif;font-size:34px}
.ig{display:inline-block;margin-top:10px;color:#ffc062;font-weight:600;text-decoration:none;direction:ltr}
</style>
</head>
